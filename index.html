<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetson Rocket PM</title>
<meta name="description" content="Owner-operated property management. Coming soon.">
<meta name="theme-color" content="#030712">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #030712;
    color: #e2e8f0;
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: 2rem;
  }

  .wordmark {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #94a3b8;
  }

  .crew {
    display: flex;
    gap: clamp(1rem, 4vw, 3rem);
    align-items: flex-end;
    flex-wrap: wrap;
    justify-content: center;
  }

  .character {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .75rem;
  }

  .character img {
    width: clamp(160px, 38vw, 320px);
    height: auto;
    border-radius: 1rem;
    display: block;
    object-fit: cover;
  }

  .character-name {
    font-size: .75rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #475569;
  }

  .tagline {
    font-size: clamp(.85rem, 2vw, 1rem);
    color: #334155;
    letter-spacing: .06em;
  }
</style>
</head>
<body>
  <p class="wordmark">Jetson Rocket PM</p>

  <div class="crew">
    <div class="character">
      <img src="topo.jpeg" alt="Topo">
      <span class="character-name">Topo</span>
    </div>
    <div class="character">
      <img src="jemby.jpeg" alt="Jemby">
      <span class="character-name">Jemby</span>
    </div>
  </div>

  <p class="tagline">back soon</p>
</body>
</html>
